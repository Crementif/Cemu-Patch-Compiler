name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v1.1.0)'
        required: true
        default: 'v1.1.0'
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025-vs2026

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Get vcpkg commit
        id: vcpkg
        shell: bash
        run: echo "commit=$(git -C dependencies/vcpkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # vcpkg reuses the cached llvm package as long as its ABI hash still matches
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ steps.vcpkg.outputs.commit }}-${{ hashFiles('vcpkg.json', 'dependencies/vcpkg_overlay_ports/**', 'dependencies/vcpkg_overlay_triplets/**') }}
          restore-keys: vcpkg-${{ steps.vcpkg.outputs.commit }}-

      - name: Configure CMake
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
        run: cmake -B build -S .

      - name: Build with CMake
        run: cmake --build build --config Release

      - name: Package Release Zip
        shell: pwsh
        run: |
          $version = "${{ inputs.tag_name }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "v1.1.0" }
          }
          $zipName = "CemuPatchCompiler-$version-windows-x64.zip"
          
          New-Item -ItemType Directory -Path release_staging -Force
          Copy-Item build\Release\CemuPatchCompiler-release.exe release_staging\CemuPatchCompiler.exe
          Copy-Item README.md release_staging\
          Copy-Item LICENSE.md release_staging\
          
          Compress-Archive -Path release_staging\* -DestinationPath $zipName -Force
          Write-Host "Created package: $zipName"
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
