name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-2025-vs2026
    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
      - uses: actions/checkout@v7

      - uses: microsoft/setup-msbuild@v2

      - name: Build ${{ matrix.configuration }}|x64
        run: msbuild "Cemu Patch Compiler.sln" /p:Configuration=${{ matrix.configuration }} /p:Platform=x64

      - name: Upload ${{ matrix.configuration }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: CemuPatchCompiler-${{ matrix.configuration }}
          path: bin/CemuPatchCompiler-${{ matrix.configuration == 'Debug' && 'debug' || 'release' }}.exe
