name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-2025-vs2026
    env:
      VCPKG_INSTALLATION_ROOT: C:\vcpkg
      VCPKG_DOWNLOADS: ${{ github.workspace }}/vcpkg-downloads
      VCPKG_DEFAULT_TRIPLET: x64-windows-static-release

    steps:
      - name: Free up disk space (Windows Runner)
        shell: pwsh
        run: |
          # Remove unused large directories
          Write-Host "Cleaning up runner to free disk space..."
          $directories = @(
            "C:\android",
            "C:\ProgramData\Docker",
            "C:\Modules",
            "C:\hostedtoolcache\windows\Ruby",
            "C:\hostedtoolcache\windows\Python",
            "C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk"
          )
          foreach ($dir in $directories) {
            if (Test-Path $dir) {
              Remove-Item -Path $dir -Recurse -Force -ErrorAction SilentlyContinue
              Write-Host "Removed $dir"
            }
          }

      - uses: actions/checkout@v7

      - name: Cache vcpkg_installed
        uses: actions/cache@v4
        id: cache-vpkg
        with:
          path: |
            vcpkg_installed
            vcpkg-downloads
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}

      - name: Configure CMake
        run: >
          cmake -B build -S . 
          -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_INSTALLATION_ROOT }}/scripts/buildsystems/vcpkg.cmake" 
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-release

      - name: Build with CMake
        run: cmake --build build --config Release

      - name: Upload Release artifact
        uses: actions/upload-artifact@v4
        with:
          name: CemuPatchCompiler-Release
          path: build/Release/CemuPatchCompiler-release.exe


