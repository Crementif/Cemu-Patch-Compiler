name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-2025-vs2026
    env:
      VCPKG_INSTALLATION_ROOT: C:\vcpkg
      VCPKG_DOWNLOADS: ${{ github.workspace }}/vcpkg-downloads
    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
      - uses: actions/checkout@v7

      - name: Cache vcpkg_installed
        uses: actions/cache@v4
        id: cache-vcpkg
        with:
          path: |
            vcpkg_installed
            vcpkg-downloads
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}

      - name: Configure CMake
        run: >
          cmake -B build -S . 
          -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_INSTALLATION_ROOT }}/scripts/buildsystems/vcpkg.cmake" 
          -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build with CMake
        run: cmake --build build --config ${{ matrix.configuration }}

      - name: Upload ${{ matrix.configuration }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: CemuPatchCompiler-${{ matrix.configuration }}
          path: build/${{ matrix.configuration }}/CemuPatchCompiler-${{ matrix.configuration == 'Debug' && 'debug' || 'release' }}.exe


