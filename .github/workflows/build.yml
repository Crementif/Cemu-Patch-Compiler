name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Get vcpkg commit
        id: vcpkg
        shell: bash
        run: echo "commit=$(git -C dependencies/vcpkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # vcpkg reuses the cached llvm package as long as its ABI hash still matches
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ steps.vcpkg.outputs.commit }}-${{ hashFiles('vcpkg.json', 'dependencies/vcpkg_overlay_ports/**', 'dependencies/vcpkg_overlay_triplets/**') }}
          restore-keys: vcpkg-${{ steps.vcpkg.outputs.commit }}-

      - name: Configure CMake
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
        run: cmake -B build -S .

      - name: Build with CMake
        run: cmake --build build --config Release

      - name: Upload Release artifact
        uses: actions/upload-artifact@v4
        with:
          name: CemuPatchCompiler-Release
          path: build/Release/CemuPatchCompiler-release.exe
